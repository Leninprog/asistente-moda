version: "3.8"

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      - IA_URL=http://ia:8001
      - SOPORTE_URL=http://soporte:8003
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - ia
      - soporte

  ia:
    build: ./services/ia
    ports:
      - "8001:8001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@db_modelos:5432/modelos
    depends_on:
      - redis
      - db_modelos

  soporte:
    build: ./services/soporte
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@db_modelos:5432/modelos
    depends_on:
      - redis
      - db_modelos

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db_modelos:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: modelos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_modelos_data:/var/lib/postgresql/data

volumes:
  db_modelos_data: